<script>
  // Theme toggle (desktop + mobile) — shared across every page via this partial.
  (function () {
    function applyIcon() {
      var dark = document.documentElement.classList.contains('dark');
      var icon = document.getElementById('theme-icon');
      var iconMobile = document.getElementById('theme-icon-mobile');
      var label = dark ? 'light_mode' : 'dark_mode';
      if (icon) icon.textContent = label;
      if (iconMobile) iconMobile.textContent = label;
    }
    function toggleTheme() {
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('bloom-theme', dark ? 'dark' : 'light'); } catch (e) {}
      applyIcon();
    }
    var btn = document.getElementById('theme-toggle');
    var btnMobile = document.getElementById('theme-toggle-mobile');
    if (btn) btn.addEventListener('click', toggleTheme);
    if (btnMobile) btnMobile.addEventListener('click', toggleTheme);
    applyIcon();
  })();
</script>
